<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#111827;#0d1117" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#161b22">
        <animate attributeName="stop-color" values="#161b22;#1a1f2e;#161b22" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#111827;#0d1117" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Accent glow gradient -->
    <radialGradient id="glow1" cx="75%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#238636; stop-opacity:0.15">
        <animate attributeName="stop-opacity" values="0.15;0.25;0.15" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#238636; stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="25%" cy="60%" r="30%">
      <stop offset="0%" style="stop-color:#1f6feb; stop-opacity:0.08">
        <animate attributeName="stop-opacity" values="0.08;0.15;0.08" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#1f6feb; stop-opacity:0"/>
    </radialGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <!-- Text glow filter -->
    <filter id="textglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#238636" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Floating particle filter -->
    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.5"/>

  <!-- Glow orbs -->
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- Animated floating particles -->
  <circle cx="150" cy="80" r="1.5" fill="#238636" opacity="0.6">
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="220" r="1" fill="#238636" opacity="0.4">
    <animate attributeName="cy" values="220;200;220" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="100" r="1.5" fill="#238636" opacity="0.5">
    <animate attributeName="cy" values="100;80;100" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="200" r="1" fill="#1f6feb" opacity="0.3">
    <animate attributeName="cy" values="200;180;200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="50" r="1" fill="#238636" opacity="0.3">
    <animate attributeName="cy" values="50;35;50" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="260" r="1.2" fill="#1f6feb" opacity="0.25">
    <animate attributeName="cy" values="260;240;260" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="180" r="0.8" fill="#238636" opacity="0.4">
    <animate attributeName="cy" values="180;165;180" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="60" r="1" fill="#238636" opacity="0.35">
    <animate attributeName="cy" values="60;45;60" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Horizontal accent line -->
  <line x1="350" y1="175" x2="850" y2="175" stroke="#238636" stroke-width="0.5" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Name -->
  <text x="600" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#e6edf3" text-anchor="middle" letter-spacing="2">
    Ajay Wadhara
  </text>

  <!-- Subtitle with accent color -->
  <text x="600" y="160" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="18" fill="#238636" text-anchor="middle" letter-spacing="4" filter="url(#textglow)">
    SOFTWARE ENGINEER
  </text>

  <!-- Bottom tagline -->
  <text x="600" y="215" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle" letter-spacing="1">
    distributed systems  ·  ai agents  ·  developer tools
  </text>

  <!-- Subtle bottom border line with gradient -->
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#238636; stop-opacity:0"/>
    <stop offset="50%" style="stop-color:#238636; stop-opacity:0.6">
      <animate attributeName="stop-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" style="stop-color:#238636; stop-opacity:0"/>
  </linearGradient>
  <line x1="200" y1="270" x2="1000" y2="270" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Corner accents -->
  <path d="M 30 30 L 30 60" stroke="#238636" stroke-width="1" opacity="0.3"/>
  <path d="M 30 30 L 60 30" stroke="#238636" stroke-width="1" opacity="0.3"/>
  <path d="M 1170 30 L 1170 60" stroke="#238636" stroke-width="1" opacity="0.3"/>
  <path d="M 1170 30 L 1140 30" stroke="#238636" stroke-width="1" opacity="0.3"/>
  <path d="M 30 270 L 30 240" stroke="#238636" stroke-width="1" opacity="0.3"/>
  <path d="M 30 270 L 60 270" stroke="#238636" stroke-width="1" opacity="0.3"/>
  <path d="M 1170 270 L 1170 240" stroke="#238636" stroke-width="1" opacity="0.3"/>
  <path d="M 1170 270 L 1140 270" stroke="#238636" stroke-width="1" opacity="0.3"/>
</svg>
